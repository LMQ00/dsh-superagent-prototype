# Example entries for $DSH_HOME/profiles/web/cordis.patch.yml: append them to the file the profile already has.
# See docs/006-deployment.md.
#
# The profile's webserver listens on 127.0.0.1:3080. Add this entry to change the host or port.
# - id: webserver
#   config:
#     host: 127.0.0.1
#     port: 3080
#
# stateDir defaults to <DSH home>/state/superagent. Add this entry to keep the state elsewhere.
# - id: dsh-superagent
#   config:
#     stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
#
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
